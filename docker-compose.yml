services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: uaiflow-app
    restart: unless-stopped
    ports:
      - "3020:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - AUTO_MIGRATE=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - supabase_default

  cron:
    image: alpine:latest
    container_name: uaiflow-cron
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env
    command: >
      sh -c "
        apk add --no-cache curl &&
        echo 'Cron iniciado: drenagem de fila a cada 60s e renovacao diaria de tokens Meta...' &&
        LAST_REFRESH=0 &&
        while true; do
          NOW=$$(date +%s)
          if [ $$((NOW - LAST_REFRESH)) -ge 86400 ]; then
            echo \"[Cron] Verificando e renovando tokens Meta...\"
            HTTP_CODE=$$(curl -s -o /dev/null -w \"%{http_code}\" -X POST -H \"x-worker-secret: $${WORKER_SECRET}\" http://app:3000/api/token/refresh)
            if [ \"$$HTTP_CODE\" = \"200\" ]; then
              echo \"[Cron] Renovacao de tokens Meta executada com sucesso (HTTP 200).\"
              LAST_REFRESH=$$NOW
            else
              echo \"[Cron] Tentativa de renovar tokens retornou HTTP $$HTTP_CODE. Tentara novamente no proximo ciclo.\"
            fi
          fi
          curl -s -X POST -H \"x-worker-secret: $${WORKER_SECRET}\" http://app:3000/api/queue/drain > /dev/null 2>&1
          sleep 60
        done
      "
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

networks:
  default:
  supabase_default:
    external: true